[package]
name = "dviewer"
version = "0.4.0"
description = "Large JSON, YAML, TOML, XML, CSV and Markdown documents, opened fast"
authors = ["yonghyeon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
memmap2 = "0.9.11"
memchr = "2.8.3"
aho-corasick = "1.1.5"
ammonia = "4.1.4"
parking_lot = "0.12.5"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig", "html", "parsing"] }
comrak = { version = "0.54.0", features = ["syntect"] }
ureq = { version = "3.4.0", features = ["rustls", "gzip", "brotli", "charset"] }
url = "2.5.8"
fontdb = "0.24.0"
serde_yaml_ng = "0.10"
toml = { version = "1.1", features = ["preserve_order"] }
quick-xml = "0.42"
encoding_rs = "0.8"
chardetng = "1.0"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# gzip only, and only the rust backend — no C toolchain in CI.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.37", features = ["bundled"] }
calamine = { version = "0.36", features = ["dates"] }
# Without arrow: its reader builds columnar batches, which is the shape for
# computing over a file and not for showing a hundred rows of one. The codecs
# are what real files are written with; `flate2-rust_backend` reuses the backend
# already here rather than pulling zlib-rs, which the default would.
parquet = { version = "59", default-features = false, features = [
    "snap",
    "zstd",
    "lz4",
    "brotli",
    "flate2-rust_backend",
] }
# Only to read the date calamine hands back. Same crate calamine already pulls,
# with the one feature that makes its accessors usable.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Serves the frontend from the binary instead of a dev server. The Tauri CLI
# turns this on for `tauri build`; without it — a plain `cargo build`, whatever
# the profile — `generate_context!` wires the webview to `devUrl`, and the app
# opens on an empty page unless vite happens to be running.
[features]
custom-protocol = ["tauri/custom-protocol"]
